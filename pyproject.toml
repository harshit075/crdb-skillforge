[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crdb-skillforge"
version = "0.1.0"
description = "Executable CockroachDB expertise for AI agents."
readme = "README.md"
authors = [{ name = "CrDB SkillForge Contributors", email = "maintainers@crdb-skillforge.org" }]
license = { text = "Apache-2.0" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["cockroachdb", "ai-agents", "mcp", "langchain", "cursor", "database", "agentic-memory"]
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0.1",
    "psycopg2-binary>=2.9.9",
    "pydantic>=2.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.0.0",
    "ruff>=0.3.0",
]
langchain = [
    "langchain-core>=0.1.0",
]
aws = [
    "boto3>=1.34.0",
]

[project.scripts]
crdb-skill-validate = "tools.validate_skill:main"
crdb-skill-new = "tools.new_skill:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tools*", "adapters*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
